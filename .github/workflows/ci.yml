name: CI

on:
  push:
  pull_request:

jobs:
  commitlint-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Run commitlint smoke test
        run: bash scripts/smoke-commitlint.sh

  skills-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skills consistency and drift
        run: python scripts/check-skills.py